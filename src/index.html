<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConstraintLayout</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.3.1/socket.io.js"></script>
    <link rel="stylesheet" href="./css/main.css"> <!-- Include your custom CSS -->
    <style>
        /* Ensure the body and HTML take full screen without any spacing */
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        /* Ensure message container covers the whole screen */
        #message-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: transparent; /* Change if needed */
            z-index: 1000; /* Ensure it is on top */
        }

        /* Ensure main layout also covers the full screen */
        #mainConstraintLayoutHome {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
<div id="message-container"></div>
<div id="mainConstraintLayoutHome" style="width: 100%; height: 100%;">

    <div id="preview_display_code" class="logo-blue-color xx-large-size" style="display: block;top:65%;left:11%;">
        D S P H R M
    </div>

    <div id="textView2" class="white-top-color normal-text-size" style="top: 39%;">
        To start, go to the website
    </div>

    <div id="textView8" class="logo-blue-color large-text-size">
        <a>sns.groupe.signageplayer</a>
    </div>

    <div id="textView3" class="white-top-color normal-text-size" style="bottom: 47%;">
        and add the screen by pair code
    </div>

    <div id="textView4" class="assign-content" style="display: block;">
        <a>Please go to the sns.signageplayer.com and assign content to the screen</a>
    </div>

    <div id="textView5" class="white medium-text-size" style="visibility: hidden; position: absolute; bottom: 10%; left: 18%;">
        Scan QR code to pair
    </div>

    <div id="textView6" class="white medium-text-size" style="visibility: hidden; position: absolute; bottom: 85%; left: 50%;">
        Signage Edition
    </div>

    <img id="qrcode_view" src="./images/logo.jpg" style="position: absolute; width: 300px; height: 300px; bottom: 30%; left: 70%;" />

</div>
<script src="./webOSTVjs-1.2.4/webOSTV.js"></script>
<script src="./js/websocket.js"></script>

</body>
</html>
