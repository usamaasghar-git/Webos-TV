<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <script src="./webOSTVjs-1.2.4/webOSTV.js" defer></script>
  <script src="./js/cache.js?v=4" defer></script>
  <script src="./js/websocket.js?v=4" defer></script>
  <title>ConstraintLayout</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.3.1/socket.io.js"></script>
  <style>
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #2F4C65;
    }
    #message-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1000;
      background-color: transparent;
    }
    a {
      text-decoration: none;
      color: inherit;
    }
    #mainConstraintLayoutHome {
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      height: 100vh;
      text-align: center;
      padding-top: 8%;
      gap: 28px; /* Increased spacing between all items */
    }
    #qrcode_view {
      width: 32%;
      height: auto;
    }
    #preview_display_code {
      font-size: 6.5rem;
      font-weight: bold;
      color: white;
      margin-top: 10px;
    }
    #textView8 {
      font-size: 4.8rem;
      color: white;
    }
    #textView3 {
      font-size: 3.2rem;
      color: white;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <div id="message-container"></div>
  <div id="alert-indicator"
       style="position: fixed; top: 10px; right: 10px; width: 20px; height: 20px; border-radius: 50%; background-color: transparent; z-index: 2147483647; pointer-events: none;">
  </div>

  <div id="mainConstraintLayoutHome">
    <img id="qrcode_view" src="./images/playerailogo.png" alt="Logo" />
    <div id="preview_display_code">D S P H R M</div>
    <div id="textView8">
      <a href="#">groupe.snsplayer.com</a>
    </div>
    <div id="textView3">Pair the device and start using</div>
  </div>
</body>
</html>
